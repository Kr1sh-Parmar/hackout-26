# Two services, deliberately.
#
# dev-05 §1 specifies four -- api, worker, redis, ui. Two of them describe
# infrastructure this build does not have and does not need:
#
#   redis   the API is a read layer over parquet; its cache is an lru_cache on a
#           DuckDB reader. A cache server in front of a memory-mapped columnar
#           file is a second thing to run and a second thing to be wrong.
#   worker  there is no APScheduler. `scripts/run_cycle.py` IS the scheduled job,
#           invoked by cron or by hand; a container whose only purpose is to
#           sleep between invocations is not an improvement on cron.
#
# `ui` is the console: a static build served by nginx, which proxies /api to the
# api service so the browser talks to one origin. Open http://localhost:8080.
#
# Host ports are overridable (API_PORT, UI_PORT) because 8000 and 8080 are exactly
# the ports a dev machine already has something on -- a local uvicorn, or Apache.
#
# The dev file should be corrected to match, per the repo's own rule about
# design docs and the build disagreeing.

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports: ["${API_PORT:-8000}:8000"]
    env_file: .env
    environment:
      # Container-local paths; the host layout is mounted onto them below.
      DATA_ROOT: /app/data
      ARTIFACT_ROOT: /app/artifacts
    volumes:
      # Read-write: a cycle run inside the container writes gold here, and the API
      # writes operator acknowledgements under data/ops.
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      # Read-only: regions are configuration and nothing at runtime edits them.
      - ./config:/app/config:ro
    restart: unless-stopped

  ui:
    build: ./frontend
    ports: ["${UI_PORT:-8080}:80"]
    depends_on: [api]
    restart: unless-stopped
