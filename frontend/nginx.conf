server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: the bundle calls /api/..., forwarded to FastAPI with the prefix stripped
  # (the trailing slash on proxy_pass does the stripping). Query strings pass through.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  # Client-side routes (/ops/BE, /evidence/IN, ...) all load the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
