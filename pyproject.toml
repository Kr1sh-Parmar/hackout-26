[project]
name = "renewable-forecast-platform"
version = "0.1.0"
description = "Probabilistic 24-72 h solar and wind forecasting with a grid decision layer."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9", "pydantic-settings>=2.6",
  "pandas>=2.2", "numpy>=1.26", "pyarrow>=17", "duckdb>=1.1",
  "pvlib>=0.11", "windpowerlib>=0.2",
  "lightgbm>=4.5", "scikit-learn>=1.5", "mapie>=0.9", "shap>=0.46",
  "pandera>=0.20", "requests>=2.32", "httpx>=0.27",
  "pyyaml>=6.0", "structlog>=24.4", "typer>=0.13", "tqdm>=4.66",
  "pulp>=2.9",  # LP dispatch in decisions.optimiser -- on the pipeline path, not optional
  "xarray>=2024.9", "netCDF4>=1.7", "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov", "pytest-asyncio", "hypothesis>=6.112",
       # ruff is PINNED: its default rule set grows between releases, so an open range made
       # CI's verdict depend on the day it ran (0.16.7 flagged 128 findings 0.11.0 does not).
       # Upgrade deliberately, fixing what the new version reports in the same commit.
       "ruff==0.11.0", "mypy>=1.13", "matplotlib>=3.9", "jupyterlab",
       "optuna>=4.0"]  # scripts/tune.py only; the served model loads pre-tuned params
# Rungs 6-7 only. Kept out of the core deps so the serving path never imports torch.
deep = ["torch>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
